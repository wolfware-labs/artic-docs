server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Requests arrive through a tunnel on another host and port, so
    # redirects must not carry this server's own origin.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # An add_header in a location replaces the server-level ones, so the
    # security headers are repeated here.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
}
