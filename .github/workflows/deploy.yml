name: Deploy

# One file for all three triggers so run_number is a single increasing
# sequence, which is what the cluster follows.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-site
        with:
          github-token: ${{ github.token }}
          docsearch-app-id: ${{ vars.PUBLIC_DOCSEARCH_APP_ID }}
          docsearch-api-key: ${{ vars.PUBLIC_DOCSEARCH_API_KEY }}
          docsearch-index: ${{ vars.PUBLIC_DOCSEARCH_INDEX }}
          mailerlite-action: ${{ vars.PUBLIC_MAILERLITE_ACTION }}
      - name: Release
        if: github.event_name == 'push'
        run: |
          pnpm release
          git fetch --tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: docker build -t artic-site:ci .
      - run: bash scripts/smoke-image.sh artic-site:ci
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          {
            echo 'list<<EOF_TAGS'
            node scripts/image-tags.mjs
            echo 'EOF_TAGS'
          } >> "$GITHUB_OUTPUT"
        env:
          IMAGE_REPO: docker.io/wolfware/artic-site
          RUN_NUMBER: ${{ github.run_number }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
