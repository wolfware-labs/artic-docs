name: Deploy

# One file for every trigger so run_number is a single increasing
# sequence, which is what the cluster follows.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  # Sent by the framework repo when an issue in a milestone, or a milestone,
  # changes, so the roadmap counts don't wait for the nightly build.
  repository_dispatch:
    types: [roadmap-changed]

# One group, so deploys never overlap. A group keeps one pending run, and a newer
# one replaces it whatever cancel-in-progress says: a rebuild that arrives while
# a push run waits cancels it. The rebuild still builds main, so the site is
# current; the release and site-<version> wait for the next push, whose
# semantic-release run picks up the skipped commits.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/build-site
        with:
          build: "false"
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Installs and builds, so it holds no secrets and only a read token.
  build:
    needs: release
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-site
        with:
          github-token: ${{ github.token }}
          docsearch-app-id: ${{ vars.PUBLIC_DOCSEARCH_APP_ID }}
          docsearch-api-key: ${{ vars.PUBLIC_DOCSEARCH_API_KEY }}
          docsearch-index: ${{ vars.PUBLIC_DOCSEARCH_INDEX }}
          mailerlite-action: ${{ vars.PUBLIC_MAILERLITE_ACTION }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Holds the Docker Hub token, so it never installs dependencies or builds: it
  # packs the site the build job uploaded. image-tags.mjs imports only local
  # code and Node built-ins.
  publish:
    needs: build
    # Without always(), a skipped release job would skip this one too.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history and tags, so a tag the release job just pushed is visible.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/
      - run: docker build -t artic-site:ci .
      - run: bash scripts/smoke-image.sh artic-site:ci
      # After the smoke test, so the token is on the runner for the push only.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested image
        run: |
          refs="$(node scripts/image-tags.mjs)"
          if [ -z "$refs" ]; then
            echo "no image tags produced" >&2
            exit 1
          fi
          while read -r ref; do
            docker tag artic-site:ci "$ref"
            docker push "$ref"
          done <<< "$refs"
        env:
          # Nightly, manual and dispatched runs rebuild the release commit, so only the push that made it moves site-<version>.
          RELEASE_TAGS: ${{ github.event_name == 'push' && 'true' || '' }}
          IMAGE_REPO: docker.io/wolfware/artic-site
          RUN_NUMBER: ${{ github.run_number }}
