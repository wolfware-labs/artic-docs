name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-site
        with:
          github-token: ${{ github.token }}
          docsearch-app-id: ${{ vars.PUBLIC_DOCSEARCH_APP_ID }}
          docsearch-api-key: ${{ vars.PUBLIC_DOCSEARCH_API_KEY }}
          docsearch-index: ${{ vars.PUBLIC_DOCSEARCH_INDEX }}
          mailerlite-action: ${{ vars.PUBLIC_MAILERLITE_ACTION }}
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-site
        with:
          github-token: ${{ github.token }}
          docsearch-app-id: ${{ vars.PUBLIC_DOCSEARCH_APP_ID }}
          docsearch-api-key: ${{ vars.PUBLIC_DOCSEARCH_API_KEY }}
          docsearch-index: ${{ vars.PUBLIC_DOCSEARCH_INDEX }}
          mailerlite-action: ${{ vars.PUBLIC_MAILERLITE_ACTION }}
      - run: docker build -t artic-site:ci .
      - run: bash scripts/smoke-image.sh artic-site:ci
